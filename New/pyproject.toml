[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Schema-constrained LLM function calling"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pydantic>=2.11.0",
    "llm-sdk",
    "accelerate>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.workspace]
members = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true, editable = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
